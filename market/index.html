<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Убийца Авито — объявления</title>
<meta name="description" content="Награды для блогеров на заказ и другие товары без комиссий.">
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --ink: #16161d;
    --muted: #6b6f7b;
    --line: #e4e5ea;
    --accent: #ff4d2e;
    --accent-ink: #ffffff;
    --ok: #12a150;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101116; --card: #1a1b22; --ink: #f0f1f5; --muted: #9a9eab;
      --line: #2a2c35; --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

  /* Header */
  header { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { display: flex; gap: 12px; align-items: center; padding: 12px 0; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px;
    text-decoration: none; white-space: nowrap; letter-spacing: -.3px; }
  .logo-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--accent);
    display: grid; place-items: center; color: #fff; font-size: 18px; }
  .search { flex: 1; display: flex; min-width: 0; }
  .search input { flex: 1; min-width: 0; padding: 10px 14px; border: 2px solid var(--accent);
    border-radius: 10px 0 0 10px; background: var(--card); outline: none; }
  .search button { border: 0; background: var(--accent); color: var(--accent-ink); padding: 0 18px;
    border-radius: 0 10px 10px 0; font-weight: 600; cursor: pointer; }
  .btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer;
    background: var(--line); white-space: nowrap; text-decoration: none; display: inline-flex;
    align-items: center; justify-content: center; gap: 6px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); }
  .btn.danger { background: #ffe1dc; color: #b42318; }
  .icon-btn { border: 0; background: transparent; cursor: pointer; font-size: 20px; padding: 6px; position: relative; }
  .badge { position: absolute; top: 0; right: 0; background: var(--accent); color: #fff; font-size: 11px;
    border-radius: 99px; padding: 0 5px; line-height: 16px; }

  /* Categories */
  .cats { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 4px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 7px 14px;
    cursor: pointer; white-space: nowrap; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* Layout */
  .layout { display: grid; grid-template-columns: 240px 1fr; gap: 20px; padding: 16px 0 40px; }
  aside .panel { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
    position: sticky; top: 84px; }
  .panel h3 { margin: 0 0 10px; font-size: 15px; }
  .row { display: flex; gap: 8px; }
  .field { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
  label.lbl { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .head h1 { font-size: 22px; margin: 0; }
  .muted { color: var(--muted); }

  /* Cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  .card { background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
    text-decoration: none; display: flex; flex-direction: column; position: relative; transition: transform .15s; }
  .card:hover { transform: translateY(-2px); }
  .thumb { aspect-ratio: 4/3; background: var(--line); object-fit: cover; width: 100%; display: block; }
  .card .body { padding: 10px 12px 14px; }
  .price { font-weight: 800; font-size: 18px; }
  .title { margin: 2px 0 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { font-size: 13px; color: var(--muted); }
  .fav { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.9); cursor: pointer; font-size: 17px; }
  .tag { position: absolute; top: 8px; left: 8px; background: var(--ok); color: #fff; font-size: 12px;
    border-radius: 6px; padding: 2px 7px; }
  .empty { text-align: center; padding: 60px 16px; color: var(--muted); background: var(--card); border-radius: var(--radius); }

  /* Item page */
  .item { display: grid; grid-template-columns: 1fr 340px; gap: 24px; padding: 20px 0 40px; }
  .item h1 { font-size: 26px; margin: 0 0 14px; }
  .gallery .main { width: 100%; aspect-ratio: 4/3; object-fit: contain; background: var(--card);
    border-radius: var(--radius); display: block; }
  .thumbs { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; }
  .thumbs img { width: 76px; height: 57px; object-fit: cover; border-radius: 8px; cursor: pointer; opacity: .6; }
  .thumbs img.on { opacity: 1; outline: 2px solid var(--accent); }
  .box { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .box h2 { font-size: 18px; margin: 0 0 10px; }
  .specs { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  .specs dt { color: var(--muted); }
  .specs dd { margin: 0; }
  .side .price { font-size: 30px; margin-bottom: 14px; }
  .side .btn { width: 100%; margin-bottom: 8px; padding: 13px; }
  .tg { background: #229ed9; color: #fff; }
  .wa { background: #25d366; color: #fff; }
  .seller { display: flex; gap: 12px; align-items: center; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 20px; flex: none; }
  .crumbs { font-size: 13px; color: var(--muted); padding-top: 16px; }
  .crumbs a { text-decoration: none; }
  .desc { white-space: pre-wrap; }

  /* Modal */
  dialog { border: 0; border-radius: 18px; padding: 0; width: min(640px, calc(100% - 24px));
    background: var(--card); color: var(--ink); max-height: calc(100% - 24px); }
  dialog::backdrop { background: rgba(10,10,15,.55); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px;
    border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 1; }
  .modal-head h2 { margin: 0; font-size: 19px; }
  .modal-body { padding: 4px 20px 20px; }
  .modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 20px;
    border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--card); flex-wrap: wrap; }
  .photos { display: flex; gap: 8px; flex-wrap: wrap; }
  .photos .ph { position: relative; }
  .photos img { width: 92px; height: 70px; object-fit: cover; border-radius: 8px; display: block; }
  .photos .x { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%;
    border: 0; background: var(--ink); color: var(--bg); cursor: pointer; font-size: 12px; }
  .add-ph { width: 92px; height: 70px; border: 2px dashed var(--line); border-radius: 8px; display: grid;
    place-items: center; cursor: pointer; color: var(--muted); font-size: 24px; }
  .admin-bar { background: #fff4d6; color: #6b4e00; font-size: 14px; }
  .admin-bar .wrap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
  .admin-bar .btn { padding: 6px 12px; font-size: 13px; background: #fff; color: #6b4e00; }
  footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--muted); font-size: 13px; }
  footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink);
    color: var(--bg); padding: 10px 18px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
  .toast.on { opacity: 1; }
  .filters-toggle { display: none; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    aside { display: none; }
    aside.open { display: block; }
    aside .panel { position: static; }
    .filters-toggle { display: inline-flex; }
    .item { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .logo-text { display: none; }
    .post-text { display: none; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .price { font-size: 16px; }
    .search button { padding: 0 12px; }
    .head h1 { font-size: 19px; }
    .head .muted { display: none; }
  }
</style>
</head>
<body>

<div id="adminBar" class="admin-bar" hidden>
  <div class="wrap">
    <b>Режим продавца.</b>
    <span id="draftInfo"></span>
    <button class="btn" id="exportBtn">⬇ Скачать data.js</button>
    <button class="btn" id="resetBtn">Сбросить черновики</button>
    <button class="btn" id="settingsBtn">⚙ Контакты</button>
    <button class="btn" id="logoutBtn">Выйти</button>
  </div>
</div>

<header>
  <div class="wrap bar">
    <a class="logo" href="#/"><span class="logo-mark">⚡</span><span class="logo-text" id="siteName">Убийца Авито</span></a>
    <form class="search" id="searchForm">
      <input id="q" type="search" placeholder="Поиск по объявлениям" autocomplete="off">
      <button>Найти</button>
    </form>
    <button class="icon-btn" id="favBtn" title="Избранное">♡<span class="badge" id="favCount" hidden></span></button>
    <button class="btn primary" id="postBtn" hidden>＋<span class="post-text">&nbsp;Разместить</span></button>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <span><span id="footName">Убийца Авито</span> · без комиссий и платных размещений</span>
    <a href="#" id="loginLink">Вход для продавца</a>
  </div>
</footer>

<dialog id="editor">
  <form method="dialog" id="editorForm">
    <div class="modal-head"><h2 id="editorTitle">Новое объявление</h2><button class="icon-btn" value="cancel" formnovalidate>✕</button></div>
    <div class="modal-body">
      <label class="lbl">Фотографии (первая станет обложкой)</label>
      <div class="photos" id="photoList"></div>
      <input type="file" id="photoInput" accept="image/*" multiple hidden>
      <label class="lbl" for="fTitle">Название</label>
      <input class="field" id="fTitle" required maxlength="100" placeholder="Например: Золотая кнопка 1M на заказ">
      <div class="row">
        <div style="flex:1">
          <label class="lbl" for="fCat">Категория</label>
          <select class="field" id="fCat"></select>
        </div>
        <div style="flex:1">
          <label class="lbl" for="fPrice">Цена, ₽</label>
          <input class="field" id="fPrice" type="number" min="0" step="1" required>
        </div>
      </div>
      <label class="lbl" for="fCity">Город</label>
      <input class="field" id="fCity" placeholder="Москва">
      <label class="lbl" for="fDesc">Описание</label>
      <textarea class="field" id="fDesc" rows="5"></textarea>
      <label class="lbl" for="fSpecs">Характеристики (каждая с новой строки: «Название: значение»)</label>
      <textarea class="field" id="fSpecs" rows="4" placeholder="Материал: металл&#10;Размер: 30 × 24 см"></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn danger" id="deleteBtn" type="button" hidden>Удалить</button>
      <span style="flex:1"></span>
      <button class="btn ghost" value="cancel" formnovalidate>Отмена</button>
      <button class="btn primary" id="saveBtn" value="save">Сохранить</button>
    </div>
  </form>
</dialog>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <div class="modal-head"><h2>Контакты продавца</h2><button class="icon-btn" value="cancel" formnovalidate>✕</button></div>
    <div class="modal-body">
      <p class="muted">Эти данные попадут в data.js и будут видны покупателям.</p>
      <label class="lbl" for="sName">Имя продавца</label>
      <input class="field" id="sName">
      <label class="lbl" for="sTg">Telegram (без @)</label>
      <input class="field" id="sTg" placeholder="username">
      <label class="lbl" for="sWa">WhatsApp (номер с кодом страны)</label>
      <input class="field" id="sWa" placeholder="79991234567">
      <label class="lbl" for="sPhone">Телефон для звонков</label>
      <input class="field" id="sPhone" placeholder="+7 999 123-45-67">
    </div>
    <div class="modal-foot">
      <button class="btn ghost" value="cancel" formnovalidate>Отмена</button>
      <button class="btn primary" value="save">Сохранить</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
// ===== Настройки сайта =====
const SITE_NAME = "Убийца Авито";
const DEFAULT_SELLER = { name: "Продавец", telegram: "", whatsapp: "", phone: "" };
const CATEGORIES = [
  { id: "all", name: "Все" },
  { id: "awards", name: "🏆 Награды для блогеров" },
  { id: "electronics", name: "📱 Электроника" },
  { id: "clothes", name: "👕 Одежда" },
  { id: "home", name: "🏠 Для дома" },
  { id: "hobby", name: "🎨 Хобби" },
  { id: "other", name: "📦 Другое" }
];

// ===== Хранилище (браузер продавца) =====
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { toast("Не хватает места в браузере: уменьшите число фото"); return false; } }
};
const K = { admin: "uk.admin", drafts: "uk.drafts", favs: "uk.favs", seller: "uk.seller" };

const published = Array.isArray(window.LISTINGS) ? window.LISTINGS : [];
const publishedSeller = window.SELLER || DEFAULT_SELLER;
let isAdmin = store.get(K.admin, false);
let favs = new Set(store.get(K.favs, []));
let state = { cat: "all", q: "", min: "", max: "", sort: "new", onlyFavs: false };

function drafts() { return store.get(K.drafts, { upserts: {}, deleted: [] }); }
function seller() { return isAdmin ? store.get(K.seller, publishedSeller) : publishedSeller; }

function allListings() {
  if (!isAdmin) return published;
  const d = drafts();
  const out = published.filter(x => !d.deleted.includes(x.id)).map(x => d.upserts[x.id] || x);
  for (const id in d.upserts) if (!published.some(x => x.id === id)) out.push(d.upserts[id]);
  return out;
}
const byId = id => allListings().find(x => x.id === id);

// ===== Утилиты =====
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => Number(n || 0).toLocaleString("ru-RU") + " ₽";
const catName = id => (CATEGORIES.find(c => c.id === id) || { name: "Другое" }).name.replace(/^\S+\s/, "");
function ago(iso) {
  const days = Math.floor((Date.now() - new Date(iso)) / 864e5);
  if (days <= 0) return "Сегодня";
  if (days === 1) return "Вчера";
  return new Date(iso).toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
}
function placeholder(p) {
  p = p || { from: "#e4e5ea", to: "#b9bcc6", label: "📦" };
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${p.from}"/><stop offset="1" stop-color="${p.to}"/></linearGradient></defs>
    <rect width="400" height="300" fill="#f0f0f3"/>
    <rect x="70" y="40" width="260" height="220" rx="18" fill="url(#g)" stroke="rgba(0,0,0,.15)" stroke-width="3"/>
    <rect x="95" y="65" width="210" height="170" rx="10" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3"/>
    <text x="200" y="168" font-family="Arial, sans-serif" font-size="56" font-weight="800" text-anchor="middle" fill="rgba(255,255,255,.95)" stroke="rgba(0,0,0,.18)" stroke-width="1.5">${esc(p.label)}</text>
  </svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
const cover = x => (x.photos && x.photos[0]) || placeholder(x.placeholder);
const photosOf = x => (x.photos && x.photos.length ? x.photos : [placeholder(x.placeholder)]);
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2400); }

// ===== Список =====
function filtered() {
  const q = state.q.trim().toLowerCase();
  let list = allListings().filter(x =>
    (state.cat === "all" || x.category === state.cat) &&
    (!state.onlyFavs || favs.has(x.id)) &&
    (state.min === "" || x.price >= +state.min) &&
    (state.max === "" || x.price <= +state.max) &&
    (!q || (x.title + " " + x.description + " " + x.city).toLowerCase().includes(q)));
  const s = { new: (a, b) => new Date(b.createdAt) - new Date(a.createdAt), cheap: (a, b) => a.price - b.price, dear: (a, b) => b.price - a.price }[state.sort];
  return list.sort(s);
}

function cardHtml(x) {
  const isNew = Date.now() - new Date(x.createdAt) < 3 * 864e5;
  return `<a class="card" href="#/item/${encodeURIComponent(x.id)}">
    <img class="thumb" src="${esc(cover(x))}" alt="${esc(x.title)}" loading="lazy">
    ${isNew ? '<span class="tag">Новое</span>' : ""}
    <button class="fav" data-fav="${esc(x.id)}" aria-label="В избранное">${favs.has(x.id) ? "❤️" : "🤍"}</button>
    <div class="body">
      <div class="price">${money(x.price)}</div>
      <div class="title">${esc(x.title)}</div>
      <div class="meta">${esc(x.city || "")}${x.city ? " · " : ""}${ago(x.createdAt)}</div>
    </div></a>`;
}

function renderList() {
  const list = filtered();
  const title = state.onlyFavs ? "Избранное" : state.cat === "all" ? "Все объявления" : catName(state.cat);
  $("#app").innerHTML = `<div class="wrap">
    <div class="cats">${CATEGORIES.map(c => `<button class="chip ${c.id === state.cat ? "on" : ""}" data-cat="${c.id}">${c.name}</button>`).join("")}</div>
    <div class="layout">
      <aside id="filters"><div class="panel">
        <h3>Фильтры</h3>
        <label class="lbl">Цена, ₽</label>
        <div class="row"><input class="field" id="min" type="number" min="0" placeholder="от" value="${esc(state.min)}">
          <input class="field" id="max" type="number" min="0" placeholder="до" value="${esc(state.max)}"></div>
        <label class="lbl">Сортировка</label>
        <select class="field" id="sort">
          <option value="new">Сначала новые</option><option value="cheap">Дешевле</option><option value="dear">Дороже</option>
        </select>
        <button class="btn ghost" id="clearF" style="width:100%;margin-top:14px">Сбросить</button>
      </div></aside>
      <section>
        <div class="head"><h1>${esc(title)}</h1>
          <span class="muted">${list.length} ${plural(list.length, "объявление", "объявления", "объявлений")}</span>
          <button class="btn ghost filters-toggle" id="ft">Фильтры</button></div>
        ${list.length ? `<div class="grid">${list.map(cardHtml).join("")}</div>` :
          `<div class="empty">Ничего не найдено.${isAdmin ? "<br><br><button class='btn primary' data-new>Разместить объявление</button>" : ""}</div>`}
      </section>
    </div></div>`;
  $("#sort").value = state.sort;
  const upd = () => { state.min = $("#min").value; state.max = $("#max").value; state.sort = $("#sort").value; renderList(); };
  $("#min").onchange = $("#max").onchange = $("#sort").onchange = upd;
  $("#clearF").onclick = () => { Object.assign(state, { min: "", max: "", sort: "new" }); renderList(); };
  $("#ft").onclick = () => $("#filters").classList.toggle("open");
}
function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; }

// ===== Страница объявления =====
function renderItem(id) {
  const x = byId(id);
  if (!x) { $("#app").innerHTML = `<div class="wrap" style="padding:40px 0"><div class="empty">Объявление снято с публикации.<br><br><a class="btn primary" href="#/">На главную</a></div></div>`; return; }
  const s = seller(), ph = photosOf(x);
  const text = encodeURIComponent(`Здравствуйте! Интересует «${x.title}» за ${money(x.price)}. ${location.href}`);
  const specs = Object.entries(x.specs || {});
  $("#app").innerHTML = `<div class="wrap">
    <div class="crumbs"><a href="#/">Главная</a> › <a href="#/" data-cat="${esc(x.category)}">${esc(catName(x.category))}</a></div>
    <div class="item">
      <div>
        <h1>${esc(x.title)}</h1>
        <div class="gallery box" style="padding:0;box-shadow:none;background:none">
          <img class="main" id="mainPh" src="${esc(ph[0])}" alt="${esc(x.title)}">
          ${ph.length > 1 ? `<div class="thumbs">${ph.map((p, i) => `<img src="${esc(p)}" data-i="${i}" class="${i ? "" : "on"}" alt="">`).join("")}</div>` : ""}
        </div>
        ${specs.length ? `<div class="box"><h2>Характеристики</h2><dl class="specs">${specs.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>` : ""}
        <div class="box"><h2>Описание</h2><div class="desc">${esc(x.description || "Без описания")}</div></div>
        <div class="muted" style="font-size:13px">${x.city ? esc(x.city) + " · " : ""}Размещено: ${ago(x.createdAt)}</div>
      </div>
      <div class="side">
        <div class="box" style="position:sticky;top:84px">
          <div class="price">${money(x.price)}</div>
          ${s.telegram ? `<a class="btn tg" target="_blank" rel="noopener" href="https://t.me/${esc(s.telegram.replace(/^@/, ""))}?text=${text}">Написать в Telegram</a>` : ""}
          ${s.whatsapp ? `<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${esc(s.whatsapp.replace(/\D/g, ""))}?text=${text}">Написать в WhatsApp</a>` : ""}
          ${s.phone ? `<a class="btn primary" href="tel:${esc(s.phone.replace(/[^\d+]/g, ""))}">Позвонить ${esc(s.phone)}</a>` : ""}
          ${!s.telegram && !s.whatsapp && !s.phone ? `<p class="muted">Контакты продавца пока не указаны.</p>` : ""}
          <button class="btn ghost" data-fav="${esc(x.id)}">${favs.has(x.id) ? "❤️ В избранном" : "🤍 Добавить в избранное"}</button>
          <button class="btn ghost" id="shareBtn">↗ Поделиться</button>
          ${isAdmin ? `<button class="btn ghost" data-edit="${esc(x.id)}">✎ Редактировать</button>` : ""}
          <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
          <div class="seller"><div class="avatar">${esc((s.name || "П")[0].toUpperCase())}</div>
            <div><b>${esc(s.name || "Продавец")}</b><div class="muted" style="font-size:13px">Частное лицо · без посредников</div></div></div>
        </div>
      </div>
    </div></div>`;
  document.querySelectorAll(".thumbs img").forEach(img => img.onclick = () => {
    $("#mainPh").src = ph[img.dataset.i];
    document.querySelectorAll(".thumbs img").forEach(i => i.classList.toggle("on", i === img));
  });
  $("#shareBtn").onclick = async () => {
    try { if (navigator.share) await navigator.share({ title: x.title, url: location.href });
      else { await navigator.clipboard.writeText(location.href); toast("Ссылка скопирована"); } } catch {}
  };
  document.title = `${x.title} — ${SITE_NAME}`;
}

// ===== Роутер =====
function route() {
  const m = location.hash.match(/^#\/item\/(.+)$/);
  if (m) renderItem(decodeURIComponent(m[1]));
  else { document.title = `${SITE_NAME} — объявления`; renderList(); }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

// ===== Глобальные клики =====
document.addEventListener("click", e => {
  const fav = e.target.closest("[data-fav]");
  if (fav) {
    e.preventDefault(); e.stopPropagation();
    const id = fav.dataset.fav;
    favs.has(id) ? favs.delete(id) : favs.add(id);
    store.set(K.favs, [...favs]); updateFavCount(); route();
    return;
  }
  const cat = e.target.closest("[data-cat]");
  if (cat) { e.preventDefault(); state.cat = cat.dataset.cat; state.onlyFavs = false; location.hash === "#/" || location.hash === "" ? renderList() : (location.hash = "#/"); return; }
  const edit = e.target.closest("[data-edit]");
  if (edit) { openEditor(edit.dataset.edit); return; }
  if (e.target.closest("[data-new]")) openEditor();
});
$("#searchForm").onsubmit = e => { e.preventDefault(); state.q = $("#q").value; state.onlyFavs = false; location.hash === "#/" || !location.hash ? renderList() : (location.hash = "#/"); };
$("#favBtn").onclick = () => { state.onlyFavs = !state.onlyFavs; location.hash === "#/" || !location.hash ? renderList() : (location.hash = "#/"); };
function updateFavCount() { const n = favs.size; $("#favCount").hidden = !n; $("#favCount").textContent = n; }

// ===== Режим продавца =====
function setAdmin(on) {
  isAdmin = on; store.set(K.admin, on);
  $("#adminBar").hidden = !on; $("#postBtn").hidden = !on;
  updateDraftInfo(); route();
}
function updateDraftInfo() {
  const d = drafts(), n = Object.keys(d.upserts).length + d.deleted.length;
  $("#draftInfo").textContent = n ? `Неопубликованных изменений: ${n}. Скачайте data.js и загрузите его в папку market/.` : "Все изменения опубликованы.";
}
$("#loginLink").onclick = e => { e.preventDefault(); setAdmin(!isAdmin); toast(isAdmin ? "Режим продавца включён" : "Режим продавца выключен"); };
$("#logoutBtn").onclick = () => setAdmin(false);
$("#postBtn").onclick = () => openEditor();
$("#resetBtn").onclick = () => {
  if (!confirm("Удалить все неопубликованные изменения в этом браузере?")) return;
  store.set(K.drafts, { upserts: {}, deleted: [] }); updateDraftInfo(); route();
};
$("#exportBtn").onclick = () => {
  const s = seller();
  const body = "// Сгенерировано сайтом " + SITE_NAME + " " + new Date().toLocaleString("ru-RU") + "\n" +
    "window.SELLER = " + JSON.stringify(s, null, 2) + ";\n" +
    "window.LISTINGS = " + JSON.stringify(allListings(), null, 2) + ";\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([body], { type: "text/javascript" }));
  a.download = "data.js"; a.click(); URL.revokeObjectURL(a.href);
  toast("data.js скачан: загрузите его в папку market/");
};
$("#settingsBtn").onclick = () => {
  const s = seller();
  $("#sName").value = s.name || ""; $("#sTg").value = s.telegram || ""; $("#sWa").value = s.whatsapp || ""; $("#sPhone").value = s.phone || "";
  $("#settings").showModal();
};
$("#settings").addEventListener("close", () => {
  if ($("#settings").returnValue !== "save") return;
  store.set(K.seller, { name: $("#sName").value.trim(), telegram: $("#sTg").value.trim().replace(/^@/, ""), whatsapp: $("#sWa").value.trim(), phone: $("#sPhone").value.trim() });
  toast("Контакты сохранены"); route();
});

// ===== Редактор объявления =====
let editing = null, editPhotos = [];
$("#fCat").innerHTML = CATEGORIES.filter(c => c.id !== "all").map(c => `<option value="${c.id}">${c.name}</option>`).join("");

function openEditor(id) {
  const x = id ? byId(id) : null;
  editing = x ? x.id : null;
  editPhotos = x ? [...(x.photos || [])] : [];
  $("#editorTitle").textContent = x ? "Редактирование" : "Новое объявление";
  $("#fTitle").value = x?.title || ""; $("#fCat").value = x?.category || "awards";
  $("#fPrice").value = x?.price ?? ""; $("#fCity").value = x?.city || seller().city || "";
  $("#fDesc").value = x?.description || "";
  $("#fSpecs").value = Object.entries(x?.specs || {}).map(([k, v]) => `${k}: ${v}`).join("\n");
  $("#deleteBtn").hidden = !x;
  renderPhotos(); $("#editor").showModal();
}
function renderPhotos() {
  $("#photoList").innerHTML = editPhotos.map((p, i) => `<div class="ph"><img src="${esc(p)}" alt=""><button type="button" class="x" data-rm="${i}">✕</button></div>`).join("") +
    `<label class="add-ph" for="photoInput" title="Добавить фото">＋</label>`;
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { editPhotos.splice(+b.dataset.rm, 1); renderPhotos(); });
}
// Сжимаем фото до 1000px, чтобы data.js оставался лёгким.
function shrink(file) {
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); ok(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = bad; img.src = URL.createObjectURL(file);
  });
}
$("#photoInput").onchange = async e => {
  for (const f of e.target.files) { try { editPhotos.push(await shrink(f)); } catch { toast("Не удалось открыть " + f.name); } }
  e.target.value = ""; renderPhotos();
};
$("#editor").addEventListener("close", () => {
  if ($("#editor").returnValue !== "save") return;
  const prev = editing ? byId(editing) : null;
  const specs = {};
  $("#fSpecs").value.split("\n").forEach(l => { const i = l.indexOf(":"); if (i > 0) specs[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
  const item = {
    id: editing || "i" + Date.now().toString(36),
    title: $("#fTitle").value.trim(), category: $("#fCat").value,
    price: Math.max(0, Math.round(+$("#fPrice").value || 0)), city: $("#fCity").value.trim(),
    createdAt: prev?.createdAt || new Date().toISOString(),
    photos: editPhotos, placeholder: prev?.placeholder,
    specs, description: $("#fDesc").value.trim()
  };
  const d = drafts(); d.upserts[item.id] = item; d.deleted = d.deleted.filter(x => x !== item.id);
  if (store.set(K.drafts, d)) { toast("Сохранено"); updateDraftInfo(); location.hash = "#/item/" + encodeURIComponent(item.id); route(); }
});
$("#deleteBtn").onclick = () => {
  if (!editing || !confirm("Удалить объявление?")) return;
  const d = drafts(); delete d.upserts[editing];
  if (published.some(x => x.id === editing) && !d.deleted.includes(editing)) d.deleted.push(editing);
  store.set(K.drafts, d); $("#editor").close("cancel"); updateDraftInfo(); location.hash = "#/";
};

// ===== Старт =====
$("#siteName").textContent = $("#footName").textContent = SITE_NAME;
updateFavCount();
setAdmin(isAdmin);
</script>
</body>
</html>
